spring:
  application:
    name: ingestion-service
  autoconfigure:
    # Requests are authenticated by the platform's own filter; no generated default user.
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:rootcause}
    username: ${DB_USERNAME:rootcause}
    password: ${DB_PASSWORD:}
    hikari:
      # Fail fast when the database is unreachable, so readiness reports DOWN promptly.
      connection-timeout: 5000 # milliseconds
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    schemas: ingestion
    # Wait for PostgreSQL while it is still starting instead of failing the startup.
    connect-retries: 12
    connect-retries-interval: 10s
  lifecycle:
    # Graceful shutdown: in-flight requests and Kafka listeners get this long to finish.
    timeout-per-shutdown-phase: 20s
  task:
    scheduling:
      shutdown:
        # A running scheduled task (e.g. an outbox batch) finishes before the pools close.
        await-termination: true
        await-termination-period: 10s
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    client-id: ${spring.application.name}
    admin:
      # Topic creation at startup gives up quickly when Kafka is not reachable.
      operation-timeout: 10s
    producer:
      # Wait for all in-sync replicas; the idempotent producer avoids duplicates on producer retries.
      acks: all
      properties:
        enable.idempotence: true
        # Fail fast while Kafka is unavailable; the outbox retries the message later.
        max.block.ms: 5000
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000

app:
  kafka:
    topics:
      error-events: ${KAFKA_TOPIC_ERROR_EVENTS:error-events.v1}
      partitions: ${KAFKA_TOPIC_PARTITIONS:3}
  outbox:
    publisher-enabled: true
    poll-interval: 1s
    batch-size: 50
    send-timeout: 10s
    initial-backoff: 1s
    max-backoff: 60s
    alert-every-attempts: 10
    retention: 7d
    # How often the backlog metrics (pending count, oldest age) are read from the database.
    metrics-refresh-interval: 15s
  # Authentication (see docs/security.md): access tokens issued by incident-service are verified
  # with the shared key; log producers send the ingestion API key. No defaults for secrets.
  auth:
    jwt-secret: ${AUTH_JWT_SECRET:}
    issuer: root-cause-platform
    audience: root-cause-platform-api
    cookie-name: rcp_session
    service-token: ${INTERNAL_SERVICE_TOKEN:}
    ingestion-api-key: ${INGESTION_API_KEY:}
  ingestion:
    # Accepted events per client address and minute (in memory, per instance).
    rate-limit-per-minute: ${INGESTION_RATE_LIMIT_PER_MINUTE:600}
  http:
    # Larger request bodies are rejected with 413 before they are read.
    max-request-body: 1MB

server:
  port: ${SERVER_PORT:8081}
  # Client address and scheme from X-Forwarded-* headers set by the dashboard's nginx proxy
  # (trusted only from private network addresses).
  forward-headers-strategy: native
  # Stop accepting requests on SIGTERM and let in-flight ones finish (see spring.lifecycle).
  shutdown: graceful

logging:
  pattern:
    # Plain-text format for local development. Docker enables JSON (ECS) output instead,
    # see LOGGING_STRUCTURED_FORMAT_CONSOLE in docker-compose.yml.
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %5p [%X{correlationId:-}] %-40.40logger{39} : %m %kvp%n%wEx"
  structured:
    ecs:
      service:
        # service.name comes from spring.application.name.
        environment: ${APP_ENVIRONMENT:local}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        # Liveness: the process works and should not be restarted. Readiness: the service can do
        # its work, which needs the database. Kafka is deliberately not part of either group
        # (see docs/operations.md, "Health model").
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
  metrics:
    distribution:
      # Fixed histogram buckets, the same as analysis-service's, so latency percentiles can be
      # compared across services.
      slo:
        http.server.requests: 5ms,10ms,25ms,50ms,100ms,250ms,500ms,1s,2500ms,5s,10s
  info:
    env:
      enabled: true

info:
  app:
    name: ${spring.application.name}
    description: Receives application logs and error events from monitored services.
