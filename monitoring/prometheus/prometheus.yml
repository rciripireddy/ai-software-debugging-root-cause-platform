# Prometheus configuration for the local Compose stack (see docs/operations.md).
# The metrics endpoints are reachable only on the Compose network: they are not routed through
# the dashboard's proxy and are not published in docker-compose.yml.

global:
  scrape_interval: 15s
  scrape_timeout: 5s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: ingestion-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["ingestion-service:8081"]

  - job_name: incident-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["incident-service:8082"]

  - job_name: analysis-service
    metrics_path: /metrics
    static_configs:
      - targets: ["analysis-service:8000"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
