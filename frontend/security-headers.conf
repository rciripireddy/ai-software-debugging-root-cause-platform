# Security headers for the dashboard's own files (included by nginx.conf in each location,
# because add_header in a location replaces the headers of the enclosing server block).

# Scripts, styles and API calls only from this origin; no inline scripts, plugins or framing.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "same-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;

# HSTS only once the dashboard is served over HTTPS (behind a TLS proxy), never over plain
# HTTP on localhost: browsers would then refuse http://localhost for the max-age period.
# add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
