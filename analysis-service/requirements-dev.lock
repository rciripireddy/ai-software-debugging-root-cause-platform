# Exact test and lint tool versions for CI and local development, installed together with
# requirements.lock (the Docker image's runtime versions, which this file never changes):
#   pip install -r requirements.lock -r requirements-dev.lock && pip install --no-deps -e .
# Resolved in a clean python:3.12-slim container, constrained by requirements.lock; regenerate
# after changing the dev dependencies in pyproject.toml:
#   docker run --rm -v "$PWD:/src:ro" python:3.12-slim sh -c \
#     "cp -r /src /tmp/app && cd /tmp/app && pip install -q -r requirements.lock \
#      && pip freeze > /tmp/runtime.txt && pip install -q -c requirements.lock '.[dev]' \
#      && pip freeze --exclude analysis-service | grep -vxFf /tmp/runtime.txt"
