[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "analysis-service"
dynamic = ["version"]
description = "Analysis service for the Software Debugging & Root Cause Platform."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.149,<1.0",
    "uvicorn>=0.54,<1.0",
    "httpx>=0.28,<1.0",
    "psycopg[binary]>=3.3,<4",
    "psycopg-pool>=3.3,<4",
    "pydantic-settings>=2.16,<3",
    "pyjwt>=2.10,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1,<10",
    "ruff>=0.17,<1.0",
    "testcontainers>=4.15,<5",
]

[tool.setuptools.dynamic]
version = { attr = "analysis_service.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"analysis_service.repositories" = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
addopts = "-ra"
markers = [
    "database: needs Docker to start a PostgreSQL container",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
