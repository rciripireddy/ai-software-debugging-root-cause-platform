spring:
  application:
    name: incident-service
  autoconfigure:
    # Requests are authenticated by the platform's own filter; no generated default user.
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:rootcause}
    username: ${DB_USERNAME:rootcause}
    password: ${DB_PASSWORD:}
    hikari:
      # Fail fast when the database is unreachable, so readiness reports DOWN promptly.
      connection-timeout: 5000 # milliseconds
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    schemas: incident
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    client-id: ${spring.application.name}
    admin:
      operation-timeout: 10s
    consumer:
      group-id: incident-service
      # A new consumer group starts with the oldest retained message, so nothing published
      # before incident-service first started is skipped.
      auto-offset-reset: earliest
    listener:
      # Commit the offset after each successfully processed record.
      ack-mode: record
      # One consumer thread per partition of error-events.v1.
      concurrency: ${KAFKA_CONSUMER_CONCURRENCY:3}
    producer:
      # Used to publish failed messages to the dead-letter topic.
      acks: all

app:
  kafka:
    topics:
      error-events: ${KAFKA_TOPIC_ERROR_EVENTS:error-events.v1}
      error-events-dlt: ${KAFKA_TOPIC_ERROR_EVENTS_DLT:error-events.v1.dlt}
      partitions: ${KAFKA_TOPIC_PARTITIONS:3}
    consumer:
      retry:
        max-retries: 3
        initial-interval: 1s
        multiplier: 2.0
        max-interval: 10s
  correlation:
    # Events below this severity are recorded as processed but do not create incidents.
    minimum-severity: ${CORRELATION_MINIMUM_SEVERITY:ERROR}
  # Authentication (see docs/security.md). incident-service owns the user accounts and issues
  # the access tokens; the secrets have no defaults and are checked at startup.
  auth:
    jwt-secret: ${AUTH_JWT_SECRET:}
    issuer: root-cause-platform
    audience: root-cause-platform-api
    token-ttl: ${AUTH_TOKEN_TTL:60m}
    cookie-name: rcp_session
    # Must be true when the dashboard is served over HTTPS.
    cookie-secure: ${AUTH_COOKIE_SECURE:false}
    service-token: ${INTERNAL_SERVICE_TOKEN:}
    login-limit:
      max-failures-per-user: ${AUTH_LOGIN_MAX_FAILURES_PER_USER:5}
      max-failures-per-client: ${AUTH_LOGIN_MAX_FAILURES_PER_CLIENT:20}
      window: ${AUTH_LOGIN_FAILURE_WINDOW:15m}
    # Accounts created at startup if they do not exist yet (local development).
    bootstrap:
      admin:
        username: ${AUTH_BOOTSTRAP_ADMIN_USERNAME:}
        password: ${AUTH_BOOTSTRAP_ADMIN_PASSWORD:}
        display-name: ${AUTH_BOOTSTRAP_ADMIN_DISPLAY_NAME:Platform Admin}
      viewer:
        username: ${AUTH_BOOTSTRAP_VIEWER_USERNAME:}
        password: ${AUTH_BOOTSTRAP_VIEWER_PASSWORD:}
        display-name: ${AUTH_BOOTSTRAP_VIEWER_DISPLAY_NAME:Dashboard Viewer}
  http:
    # Larger request bodies are rejected with 413 before they are read.
    max-request-body: 1MB

server:
  port: ${SERVER_PORT:8082}
  # Client address and scheme from X-Forwarded-* headers set by the dashboard's nginx proxy
  # (trusted only from private network addresses).
  forward-headers-strategy: native

logging:
  pattern:
    # Plain-text format for local development. Docker enables JSON (ECS) output instead,
    # see LOGGING_STRUCTURED_FORMAT_CONSOLE in docker-compose.yml.
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %5p [%X{correlationId:-}] %-40.40logger{39} : %m %kvp%n%wEx"

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
  info:
    env:
      enabled: true

info:
  app:
    name: ${spring.application.name}
    description: Groups related errors into incidents and tracks their lifecycle.
