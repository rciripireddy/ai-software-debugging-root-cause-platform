spring:
  application:
    name: ingestion-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:rootcause}
    username: ${DB_USERNAME:rootcause}
    password: ${DB_PASSWORD:}
    hikari:
      # Fail fast when the database is unreachable, so readiness reports DOWN promptly.
      connection-timeout: 5000 # milliseconds
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    schemas: ingestion
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    client-id: ${spring.application.name}
    admin:
      # Topic creation at startup gives up quickly when Kafka is not reachable.
      operation-timeout: 10s
    producer:
      # Wait for all in-sync replicas; the idempotent producer avoids duplicates on producer retries.
      acks: all
      properties:
        enable.idempotence: true
        # Fail fast while Kafka is unavailable; the outbox retries the message later.
        max.block.ms: 5000
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000

app:
  kafka:
    topics:
      error-events: ${KAFKA_TOPIC_ERROR_EVENTS:error-events.v1}
      partitions: ${KAFKA_TOPIC_PARTITIONS:3}
  outbox:
    publisher-enabled: true
    poll-interval: 1s
    batch-size: 50
    send-timeout: 10s
    initial-backoff: 1s
    max-backoff: 60s
    alert-every-attempts: 10
    retention: 7d

server:
  port: ${SERVER_PORT:8081}

logging:
  pattern:
    # Plain-text format for local development. Docker enables JSON (ECS) output instead,
    # see LOGGING_STRUCTURED_FORMAT_CONSOLE in docker-compose.yml.
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %5p [%X{correlationId:-}] %-40.40logger{39} : %m %kvp%n%wEx"

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
  info:
    env:
      enabled: true

info:
  app:
    name: ${spring.application.name}
    description: Receives application logs and error events from monitored services.
