# Included in nginx's http block (conf.d/default.conf).

# Correlation ID for each request: a well-formed X-Correlation-Id from the client is kept,
# anything else is replaced with nginx's own request ID. Sent to the services, which use the same
# rule, and written to the access log, so one ID links the proxy and service log lines.
map $http_x_correlation_id $correlation_id {
    "~^[A-Za-z0-9._:-]{1,128}$" $http_x_correlation_id;
    default                     $request_id;
}

# The requested path without the query string (search terms are not logged).
map $request_uri $request_path {
    "~^(?<path>[^?]*)" $path;
}

# One JSON object per line with ECS field names, like the services' logs. No headers, cookies
# or bodies are logged.
log_format json_access escape=json
    '{"@timestamp":"$time_iso8601","log.level":"INFO","service.name":"frontend",'
    '"event.dataset":"nginx.access","message":"$request_method $request_path $status",'
    '"http.request.method":"$request_method","url.path":"$request_path",'
    '"http.response.status_code":$status,"http.response.body.bytes":$body_bytes_sent,'
    '"durationSeconds":$request_time,"upstream.address":"$upstream_addr","correlationId":"$correlation_id"}';

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    access_log /var/log/nginx/access.log json_access;

    # The largest API body (a log event) is far below this; the services enforce the same limit.
    client_max_body_size 1m;

    # Docker's embedded DNS. Resolving upstreams per request lets the dashboard start
    # (and report services as unreachable) even when a backend container is not running.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # The client address for the services' rate limits and logs. Replaces any X-Forwarded-For
    # sent by the browser, so it cannot be spoofed through the proxy.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Correlation-Id $correlation_id;

    # Metrics and the other operational endpoints are for Prometheus on the internal network
    # only. Health checks stay reachable for the dashboard's Service Health page.
    location ~ ^/api/(ingestion|incident)/actuator/(?!health) {
        return 404;
    }

    location = /api/analysis/metrics {
        return 404;
    }

    # API responses carry the services' own security headers (see docs/security.md).
    location /api/ingestion/ {
        set $upstream http://ingestion-service:8081;
        rewrite ^/api/ingestion/(.*)$ /$1 break;
        proxy_pass $upstream;
    }

    location /api/incident/ {
        set $upstream http://incident-service:8082;
        rewrite ^/api/incident/(.*)$ /$1 break;
        proxy_pass $upstream;
    }

    location /api/analysis/ {
        set $upstream http://analysis-service:8000;
        rewrite ^/api/analysis/(.*)$ /$1 break;
        proxy_pass $upstream;
    }

    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        # Fingerprinted static files: not worth a log line each.
        access_log off;
        try_files $uri =404;
    }

    # Client-side routing: serve index.html for application routes.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
